@if (view(); as view) {
  <div class="bytes-container">
    <div class="container">
      <div class="bytes">
        <app-bytes-container class="bytes-section" [bytes]="view.bytes" [startOffsetDec]="view.startOffsetDec"></app-bytes-container>
        @if (view.pe.isManaged) {
          <app-bytes-container class="bytes-section" [bytes]="view.cliMetadataHeaderBytes" [startOffsetDec]="view.cliMetadataHeaderStartOffsetDec"></app-bytes-container>
        }
        @if (view.pe.isManaged && !view.pe.is64Bit) {
          <app-bytes-container class="bytes-section" [bytes]="view.importTableEntryPointBytes" [startOffsetDec]="view.importTableEntryPointStartOffsetDec"></app-bytes-container>
        }
      </div>
      <div class="bytes-legend">
        <app-legend-headers [pe]="view.pe"></app-legend-headers>
      </div>
    </div>
  </div>
  <app-va-convertor [pe]="view.pe"></app-va-convertor>
}
